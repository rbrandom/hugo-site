<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.GoogleAnalyticsID }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{ .Site.Params.GoogleAnalyticsID }}');
</script>

<!-- Panopto Link Click Tracking & PDF Download Tracking -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Track all Panopto video/audio link clicks
    document.querySelectorAll('a[href*="panopto.com"]').forEach(function(link) {
      link.addEventListener('click', function(e) {
        var linkUrl = this.href;
        var linkText = this.textContent.trim();
        var videoType = linkText.toLowerCase().includes('audio') ? 'Audio' : 'Video';

        // Send event to Google Analytics
        gtag('event', 'panopto_click', {
          'event_category': 'Video',
          'event_label': linkText,
          'video_type': videoType,
          'video_url': linkUrl
        });
      });
    });

    // Track all PDF download clicks
    document.querySelectorAll('a[href$=".pdf"]').forEach(function(link) {
      link.addEventListener('click', function(e) {
        var pdfUrl = this.href;
        var pdfName = pdfUrl.split('/').pop(); // Extract filename from URL
        var linkText = this.textContent.trim() || pdfName;

        // Send event to Google Analytics
        gtag('event', 'pdf_download', {
          'event_category': 'Download',
          'event_label': pdfName,
          'link_text': linkText,
          'file_url': pdfUrl
        });
      });
    });

    // Track all outbound link clicks (external links)
    document.querySelectorAll('a[href^="http"]').forEach(function(link) {
      link.addEventListener('click', function(e) {
        var linkUrl = this.href;
        var linkText = this.textContent.trim();
        var linkDomain = new URL(linkUrl).hostname;
        var currentDomain = window.location.hostname;

        // Only track if it's an external link (not same domain)
        // And exclude Panopto (already tracked separately)
        if (linkDomain !== currentDomain && !linkUrl.includes('panopto.com')) {
          // Categorize common external sites
          var siteCategory = 'Other';
          if (linkUrl.includes('wikipedia.org')) siteCategory = 'Wikipedia';
          else if (linkUrl.includes('philpeople.org')) siteCategory = 'PhilPeople';
          else if (linkUrl.includes('scholar.google.com')) siteCategory = 'Google Scholar';
          else if (linkUrl.includes('zoom.us')) siteCategory = 'Zoom';
          else if (linkUrl.includes('github.com')) siteCategory = 'GitHub';

          // Send event to Google Analytics
          gtag('event', 'outbound_click', {
            'event_category': 'Outbound Link',
            'event_label': linkDomain,
            'link_text': linkText,
            'link_url': linkUrl,
            'site_category': siteCategory
          });
        }
      });
    });
  });
</script>
